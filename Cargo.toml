[package]
name = "akeep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Privacy-first, Git-like backup, recovery, migration, and sharing for AI agent session history"
license = "MIT"
repository = "https://github.com/eunomia-bpf/akeep"
homepage = "https://github.com/eunomia-bpf/akeep"
readme = "README.md"
publish = ["crates-io"]
keywords = ["backup", "ai-agents", "claude-code", "codex", "privacy"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
age = "0.12.1"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
filetime = "0.2"
fs2 = "0.4"
gethostname = "1.1"
rayon = "1.11"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tempfile = "3.20"
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = "symbols"
