[package]
name = "akeep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Private, verified backup and recovery for coding-agent work"
license = "MIT"
repository = "https://github.com/eunomia-bpf/akeep"
readme = "README.md"
keywords = ["backup", "ai-agents", "claude-code", "codex", "privacy"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
