name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: akeep-release
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Check release source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_VERSION" = "$version"
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="akeep-v${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/akeep" README.md CHANGELOG.md LICENSE dist/package/
          "dist/package/akeep" --version
          tar -C dist/package -czf "dist/${archive}" .
          rm -rf dist/package
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-crate:
    name: Publish crate
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish version if absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: akeep-release (https://github.com/eunomia-bpf/akeep)' \
            "https://crates.io/api/v1/crates/akeep/${RELEASE_VERSION}")"
          if [ "$status" = 404 ]; then
            cargo publish --locked --no-verify
          elif [ "$status" != 200 ]; then
            echo "unexpected crates.io status: $status" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub release
    needs: [build, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate release assets
        run: |
          cp scripts/install.sh dist/install.sh
          cd dist
          sha256sum *.tar.gz install.sh > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $tag"
          else
            flags=()
            case "$RELEASE_VERSION" in
              *-*) flags+=(--prerelease) ;;
              *) flags+=(--latest) ;;
            esac
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Akeep ${tag}" \
              --generate-notes \
              "${flags[@]}" \
              dist/*
          fi

  release-smoke:
    name: Release smoke (${{ matrix.target }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download and verify public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          mkdir release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          archive="akeep-${tag}-${{ matrix.target }}.tar.gz"
          expected="$(awk -v archive="$archive" '$2 == archive { print $1 }' SHA256SUMS)"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$archive" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          test -n "$expected" && test "$actual" = "$expected"
          tar -xzf "$archive"
          test "$(./akeep --version)" = "akeep $RELEASE_VERSION"
      - name: Exercise public installer
        env:
          AKEEP_INSTALL_DIR: ${{ runner.temp }}/akeep-public-install
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            sh release/install.sh "v${RELEASE_VERSION}"
          else
            sh release/install.sh
          fi
          test "$("$AKEEP_INSTALL_DIR/akeep" --version)" = "akeep $RELEASE_VERSION"
      - name: Exercise installed binary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/akeep-release-smoke"
          mkdir -p "$root/claude/projects/demo"
          printf '{"message":"release smoke"}\n' > "$root/claude/projects/demo/session.jsonl"
          export CLAUDE_CONFIG_DIR="$root/claude"
          release/akeep --config "$root/config.toml" init --target "$root/vault"
          release/akeep --config "$root/config.toml" commit -m "release smoke"
          release/akeep --config "$root/config.toml" fsck HEAD

  registry-smoke:
    name: crates.io install smoke
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from crates.io
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            args=()
            case "$RELEASE_VERSION" in
              *-*) args+=(--version "$RELEASE_VERSION") ;;
            esac
            if cargo install akeep "${args[@]}" --locked --root "$RUNNER_TEMP/akeep-registry"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 30
          done
          installed="$("$RUNNER_TEMP/akeep-registry/bin/akeep" --version)"
          test "$installed" = "akeep $RELEASE_VERSION"
