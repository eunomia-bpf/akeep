name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Synthetic trust demo
        run: AKEEP_BIN=target/debug/akeep ./scripts/demo.sh
      - name: Package
        run: cargo package --locked
      - name: Install packaged CLI
        shell: bash
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/akeep-install"
          "$RUNNER_TEMP/akeep-install/bin/akeep" --version

  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked

  release-check:
    name: Check automatic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, msrv]
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        name: Compare public versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="v${version}"
          grep -F "## [$version]" CHANGELOG.md >/dev/null
          crate_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: akeep-release-check (https://github.com/eunomia-bpf/akeep)' \
            "https://crates.io/api/v1/crates/akeep/${version}")"
          case "$crate_status" in
            200) crate_exists=true ;;
            404) crate_exists=false ;;
            *) echo "unexpected crates.io status: $crate_status" >&2; exit 1 ;;
          esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          if [ "$crate_exists" = true ] && [ "$release_exists" = true ]; then
            needed=false
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Automatic release
    needs: release-check
    if: needs.release-check.outputs.needed == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-check.outputs.version }}
      sha: ${{ github.sha }}
    secrets: inherit
